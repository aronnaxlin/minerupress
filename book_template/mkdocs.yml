site_name: 书名（第X版）
site_description: 作者《书名》在线教程
site_author: 作者
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

# MathJax 固定在 3.2.2，避免 CDN 上的浮动版本在站点没改动时悄悄升级。
# 离线或内网环境读不到 unpkg：把 mathjax@3.2.2 的整个 es5/ 目录（含字体）
# 放进 docs/javascripts/mathjax/，再把下面的地址改成
# javascripts/mathjax/tex-mml-chtml.js。
extra_javascript:
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 各章内容:
      - 示例章节（请用 minerupress headings 的输出替换）: chapters/ch01-overview.md
