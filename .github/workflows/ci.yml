name: CI

# Runs on pull requests, and is called by release.yml for pushes to main and
# version tags so that a release is always gated on the same tests.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall minerupress

      - name: Test
        run: pytest

  # The matrix above covers a plain dev install, where plugin tests skip.
  # This job installs the optional extras so the plugin tests actually run.
  test-extras:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev,all]"

      - name: Test
        run: pytest
